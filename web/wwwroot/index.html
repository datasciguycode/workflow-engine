<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- No-cache during active dev/phone-testing (2026-10-31): Safari was serving a stale
         cached copy of this page itself, so CSS edits never showed up even after reload. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>WorkflowApp.Web</title>
    <!-- CI stamps a fresh build id below on every deploy; see .github/workflows/deploy-pages.yml -->
    <meta name="build-id" content="dev" />
    <!-- CI rewrites the base href below to the Pages base path; see .github/workflows/deploy-pages.yml -->
    <base href="/" />
    <script>
      // Counterpart to 404.html (GitHub Pages SPA fallback): turn /workflow-engine/?/workflow/abc&x=1
      // back into /workflow-engine/workflow/abc?x=1 before the Blazor router reads the URL.
      // No-op unless the query string starts with "?/", so local dev is unaffected.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
    <script>
      // GitHub Pages sends every file with a 10-minute browser cache, which the no-cache meta
      // tags above don't override -- real HTTP cache-control headers win. That leaves this page
      // free to serve a stale copy of itself for up to 10 minutes after a deploy, and iOS's
      // Home Screen "standalone" shell doesn't reliably revalidate it on relaunch either
      // (2026-11-06: multiple updates failed to show up after a deploy + full app relaunch).
      // This re-fetches the page itself with cache bypassed and force-reloads once, via a
      // cache-busting query string, if the build id it finds doesn't match what's currently
      // loaded. Guarded by sessionStorage so it only runs once per launch, not on every
      // in-app navigation (which doesn't re-run this script anyway, since Blazor is an SPA).
      // Keyed on document.baseURI (not a flat flag) because dev and prod Pages share the
      // datasciguycode.github.io origin, hence one sessionStorage: a flat key set by visiting
      // one site in a tab would silently suppress the other site's check in that same tab.
      (function () {
        try {
          var k = 'buildCheckDone:' + document.baseURI;
          if (sessionStorage.getItem(k)) return;
          sessionStorage.setItem(k, '1');
          var current = document.querySelector('meta[name="build-id"]').content;
          fetch(location.pathname, { cache: 'no-store' })
            .then(function (r) { return r.text(); })
            .then(function (html) {
              var m = html.match(/name="build-id" content="([^"]+)"/);
              if (m && m[1] && m[1] !== current) {
                location.replace(location.pathname + '?_cb=' + Date.now() + location.hash);
              }
            })
            .catch(function () { });
        } catch (e) { }
      })();
    </script>
    <link rel="preload" id="webassembly" />
    <link href="_content/Microsoft.FluentUI.AspNetCore.Components/css/reboot.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css?v=20261109a" />
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="WorkflowApp.Web.styles.css" rel="stylesheet" /> -->
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body no-fuib-style>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="js/focus.js"></script>
    <script src="js/pull-to-refresh.js"></script>
    <!-- Service worker registration disabled during active dev/phone-testing (2026-10-30):
         iOS Safari was caching stale builds behind it, hiding real UI changes after every
         rebuild. service-worker.js itself is untouched -- re-enable this line before the real
         production deploy, when offline PWA support actually matters. -->
    <!-- <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script> -->
</body>

</html>
